# Manual release only. Update ClassworksPlugin.csproj and plugin.json locally before running it.
name: Classworks Plugin Release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Must match plugin.json version exactly (for example 0.2.0)"
        required: true
        type: string

env:
  DOTNET_VERSION: "10.0.x"
  LMD_REPOSITORY: wwiinnddyy/LanMountainDesktop
  LANMOUNTAIN_SDK_REF: "a858860b3feb006bb054bcd1f293df88dd86eb45"

permissions:
  contents: write

concurrency:
  group: classworks-plugin-release-${{ github.event.inputs.confirm_version || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout LanMountainDesktop
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LMD_REPOSITORY }}
          ref: ${{ env.LANMOUNTAIN_SDK_REF }}
          fetch-depth: 0
          path: LanMountainDesktop

      - name: Checkout LanAirApp validator
        uses: actions/checkout@v7
        with:
          repository: wwiinnddyy/LanAirApp
          path: LanAirApp

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize local package feed
        shell: pwsh
        run: |
          $repoRoot = (Resolve-Path ".").Path
          $feedPath = Join-Path $repoRoot "packages"
          $sdkProject = Join-Path (Resolve-Path ".\LanMountainDesktop\LanMountainDesktop.PluginSdk").Path "LanMountainDesktop.PluginSdk.csproj"
          $contractsProject = Join-Path (Resolve-Path ".\LanMountainDesktop\LanMountainDesktop.Shared.Contracts").Path "LanMountainDesktop.Shared.Contracts.csproj"
          $pluginIsolationContractsProject = Join-Path (Resolve-Path ".\LanMountainDesktop\LanMountainDesktop.PluginIsolation.Contracts").Path "LanMountainDesktop.PluginIsolation.Contracts.csproj"
          $sharedIpcProject = Join-Path (Resolve-Path ".\LanMountainDesktop\LanMountainDesktop.Shared.IPC").Path "LanMountainDesktop.Shared.IPC.csproj"
          .\scripts\Initialize-LocalPackageFeed.ps1 `
            -FeedPath $feedPath `
            -PluginSdkProjectPath $sdkProject `
            -CoreContractsProjectPath $contractsProject `
            -PluginIsolationContractsProjectPath $pluginIsolationContractsProject `
            -SharedIpcProjectPath $sharedIpcProject

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          $manifest = Get-Content .\plugin.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $version = $manifest.version.Trim()
          $requested = "${{ github.event.inputs.confirm_version }}".Trim()
          if ($requested.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $requested = $requested.Substring(1)
          }

          if ($requested -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release version must be a three-part version."
          }

          if ($version -ne $requested) {
            throw "Confirm version '$requested' does not match plugin.json version '$version'."
          }

          $releaseTag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$releaseTag"
          if (-not [string]::IsNullOrWhiteSpace(($existingTag -join ""))) {
            throw "Tag '$releaseTag' already exists; release assets will not be overwritten."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "asset_name=$($manifest.id).$version.laapp" >> $env:GITHUB_OUTPUT

      - name: Validate plugin metadata
        shell: pwsh
        run: .\scripts\Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path

      - name: Run plugin regression tests
        shell: pwsh
        run: |
          dotnet restore .\ClassworksPlugin.Tests\ClassworksPlugin.Tests.csproj --configfile .\NuGet.config --force --no-cache
          dotnet test .\ClassworksPlugin.Tests\ClassworksPlugin.Tests.csproj -c Release --no-restore

      - name: Build plugin package
        shell: pwsh
        run: |
          dotnet restore .\ClassworksPlugin.csproj --configfile .\NuGet.config --force --no-cache
          dotnet build .\ClassworksPlugin.csproj -c Release -v minimal --no-restore

      - name: Validate built package
        shell: pwsh
        run: .\scripts\Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path -PackagePath ".\${{ steps.metadata.outputs.asset_name }}"

      - name: Generate release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          $packagePath = (Resolve-Path ".\${{ steps.metadata.outputs.asset_name }}").Path
          $sha256 = (Get-FileHash -Path $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $md5 = (Get-FileHash -Path $packagePath -Algorithm MD5).Hash.ToLowerInvariant()
          Set-Content -Path .\artifacts\sha256.txt -Value $sha256 -Encoding utf8NoBOM
          Set-Content -Path .\artifacts\md5.txt -Value $md5 -Encoding utf8NoBOM
          .\scripts\New-MarketManifest.ps1 `
            -TemplatePath .\airappmarket-entry.template.json `
            -PackagePath $packagePath `
            -Version "${{ steps.metadata.outputs.version }}" `
            -ReleaseTag "${{ steps.metadata.outputs.release_tag }}" `
            -OutputPath .\artifacts\market-manifest.json

          .\scripts\Test-PluginConsistency.ps1 `
            -RepositoryRoot (Resolve-Path ".").Path `
            -PackagePath $packagePath `
            -MarketManifestPath .\artifacts\market-manifest.json

          dotnet run --project .\LanAirApp\airappmarket\tools\AirAppMarket.IndexBuilder -- `
            --validate-release-package $packagePath `
            --market-manifest .\artifacts\market-manifest.json `
            --plugin-id Classworks4LanDesktop
          @"
          ## ${{ steps.metadata.outputs.release_tag }}

          > Draft prerelease: validate the package in LanMountainDesktop before promoting it to stable.

          - Package: ``${{ steps.metadata.outputs.asset_name }}``
          - Plugin API: ``5.0.0``
          - SHA256: ``$sha256``
          - MD5: ``$md5``
          "@ | Set-Content -Path .\artifacts\release-notes.md -Encoding utf8

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.release_tag }}
          body_path: artifacts/release-notes.md
          files: |
            ${{ steps.metadata.outputs.asset_name }}
            artifacts/market-manifest.json
            artifacts/sha256.txt
            artifacts/md5.txt
          fail_on_unmatched_files: true
          draft: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
