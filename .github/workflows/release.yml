name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: ClassworksPlugin.csproj
  TEST_PROJECT: ClassworksPlugin.Tests/ClassworksPlugin.Tests.csproj
  # lanmountain 源的凭据槽（NuGet.config 用 %VAR% 取用）。实测工作流自带的 GITHUB_TOKEN 就读得到公开包：
  # 同一 job 里假 token 报 NU1301/401，换成 GITHUB_TOKEN 就还原成功——不需要再配 PAT 或仓库 secret。
  LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
  LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Build, test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: |
          dotnet restore ${{ env.PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Debug

      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Verify manifest consistency
        shell: pwsh
        run: ./scripts/Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path

      - name: Generate market manifest
        shell: pwsh
        run: ./scripts/New-MarketManifest.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.laapp
            artifacts/market-manifest.json
          generate_release_notes: true
