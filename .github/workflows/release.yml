name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: ClassworksPlugin.csproj
  TEST_PROJECT: ClassworksPlugin.Tests/ClassworksPlugin.Tests.csproj
  # NuGet.config 里的 lanmountain 源用这两个环境变量取凭据（源地址与凭据槽只在 NuGet.config 说一次）。
  LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
  LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.LANMOUNTAIN_PACKAGES_TOKEN }}

jobs:
  release:
    name: Build, test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      # NuGet.config 用 %LANMOUNTAIN_PACKAGES_TOKEN% 取凭据：变量没设时那一格被替换成空串，
      # 还原层报的是 "Value cannot be null or empty string. (Parameter 'password')"，
      # 看不出真正缺的是什么。这里先翻译成人话。
      - name: Require the packages credential
        shell: bash
        env:
          TOKEN: ${{ secrets.LANMOUNTAIN_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::仓库还没配置 LANMOUNTAIN_PACKAGES_TOKEN（一张带 read:packages 权限的 PAT）。位置：Settings → Secrets and variables → Actions → New repository secret。"
            exit 1
          fi

      - name: Restore
        run: |
          dotnet restore ${{ env.PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Debug

      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Verify manifest consistency
        shell: pwsh
        run: ./scripts/Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path

      - name: Generate market manifest
        shell: pwsh
        run: ./scripts/New-MarketManifest.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.laapp
            artifacts/market-manifest.json
          generate_release_notes: true
