name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: ClassworksPlugin.csproj
  TEST_PROJECT: ClassworksPlugin.Tests/ClassworksPlugin.Tests.csproj

jobs:
  release:
    name: Build, test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      # 源地址的真源是本仓库的 NuGet.config（那里已登记了名为 lanmountain 的源）。
      # 这里只给它补凭据，不许再 add source：add 撞上同名源会直接失败
      # （实测报 "The name specified has already been added to the list of available package sources."，
      # 整条流水线在 Restore 之前就红）。update source 幂等，--configfile 指到仓库那份 NuGet.config，
      # 只往 packageSourceCredentials 里写用户名与口令，不动源地址。
      - name: Attach credentials to the LanMountain package source
        run: >
          dotnet nuget update source lanmountain
          --source https://nuget.pkg.github.com/wwiinnddyy/index.json
          --username ${{ github.actor }}
          --password ${{ secrets.LANMOUNTAIN_PACKAGES_TOKEN }}
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: |
          dotnet restore ${{ env.PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Debug

      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Verify manifest consistency
        shell: pwsh
        run: ./scripts/Test-PluginConsistency.ps1 -RepositoryRoot (Resolve-Path ".").Path

      - name: Generate market manifest
        shell: pwsh
        run: ./scripts/New-MarketManifest.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.laapp
            artifacts/market-manifest.json
          generate_release_notes: true
